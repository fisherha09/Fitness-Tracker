<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Forge — Fitness & Body Composition Tracker</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div><strong>Forge</strong><span>Fitness tracker</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <button class="ghost small" id="themeToggle">Toggle theme</button>
        <div class="save-status" id="saveStatus">Saved locally</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open navigation">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Your training, nutrition and body composition in one place.</p>
        </div>
        <div class="top-actions">
          <button class="secondary" id="quickLogBtn">+ Quick log</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle"></h2>
          <p id="modalSubtitle"></p>
        </div>
        <button class="icon-btn" id="modalClose" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
